name: Publish to itch.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Display version (blank uses the selected tag or commit)'
        type: string
        required: false
      publish:
        description: 'Publish all three builds to itch.io'
        type: boolean
        default: true
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

# One release at a time; never cancel an upload halfway through a release.
concurrency:
  group: itch-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Choose display version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$REQUESTED_VERSION"
          if [[ -z "$version" ]]; then
            if [[ "$REF_TYPE" == tag ]]; then
              version="$REF_NAME"
            else
              version="dev-${GITHUB_SHA:0:12}"
            fi
          fi
          if [[ ! "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,79}$ ]]; then
            echo 'Version must be 1–80 letters, numbers, dots, underscores, pluses or hyphens, starting with a letter or number.' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows, macos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified Godot and matching export templates
        id: tools
        run: python3 tools/ci_install.py godot --directory "$RUNNER_TEMP/toolchain"
      - name: Export release without editor services or development assets
        env:
          GODOT: ${{ steps.tools.outputs.godot }}
          TEMPLATES: ${{ steps.tools.outputs.templates }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          python3 tools/export_game.py \
            --platform "$PLATFORM" --godot "$GODOT" --templates "$TEMPLATES" \
            --output "dist/JustLife-$PLATFORM" --work-dir "$RUNNER_TEMP/export"
      - name: Smoke test the Linux executable
        if: matrix.platform == 'linux'
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/smoke/data
          XDG_CONFIG_HOME: ${{ runner.temp }}/smoke/config
          XDG_CACHE_HOME: ${{ runner.temp }}/smoke/cache
          JUSTLIFE_DATA_DIR: ${{ runner.temp }}/smoke/saves
        run: |
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$JUSTLIFE_DATA_DIR"
          timeout 120 dist/JustLife-linux/JustLife.x86_64 --headless --quit-after 30 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          if grep -F 'ERROR:' "$RUNNER_TEMP/smoke.log"; then
            exit 1
          fi
      - name: Preserve executable permissions and package checksums
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          tar -C dist -czf "dist/JustLife-$PLATFORM.tar.gz" "JustLife-$PLATFORM"
          cd dist
          sha256sum "JustLife-$PLATFORM.tar.gz" > "JustLife-$PLATFORM.tar.gz.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: JustLife-${{ matrix.platform }}
          path: |
            dist/JustLife-${{ matrix.platform }}.tar.gz
            dist/JustLife-${{ matrix.platform }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Retain export diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/export/**/*.log
            ${{ runner.temp }}/smoke.log
          retention-days: 7

  native-check:
    name: Startup on ${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2025
          - platform: macos
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci_smoke.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: JustLife-${{ matrix.platform }}
          path: packages
      - name: Verify and start the packaged game on its native OS
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          tar -C packages -xzf "packages/JustLife-$PLATFORM.tar.gz"
          python_cmd=python3
          if ! command -v "$python_cmd" >/dev/null; then python_cmd=python; fi
          "$python_cmd" tools/ci_smoke.py --platform "$PLATFORM" \
            --package "packages/JustLife-$PLATFORM" --work-dir "$RUNNER_TEMP/native-smoke"
      - name: Retain native startup diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-native-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-smoke/**/*.log
          retention-days: 7

  publish:
    name: Publish all platforms
    needs: [prepare, build, native-check]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci_install.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: JustLife-*
          path: packages
          merge-multiple: true
      - name: Verify and unpack all three build artifacts
        run: |
          cd packages
          for platform in linux windows macos; do
            sha256sum -c "JustLife-$platform.tar.gz.sha256"
            tar -xzf "JustLife-$platform.tar.gz"
          done
          test -x JustLife-linux/JustLife.x86_64
          test -f JustLife-windows/JustLife.exe
          python3 -m zipfile -t JustLife-macos/JustLife.zip
      - name: Install verified butler
        id: tools
        run: python3 tools/ci_install.py butler --directory "$RUNNER_TEMP/butler"
      - name: Publish Linux, Windows and macOS
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          BUTLER: ${{ steps.tools.outputs.butler }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [[ -z "$BUTLER_API_KEY" ]]; then
            echo 'Set the repository Actions secret BUTLER_API_KEY before publishing.' >&2
            exit 1
          fi
          "$BUTLER" push packages/JustLife-linux impulse20/justlife:linux-x86_64 --userversion "$VERSION" --fix-permissions
          "$BUTLER" push packages/JustLife-windows impulse20/justlife:windows-x86_64 --userversion "$VERSION"
          "$BUTLER" push packages/JustLife-macos/JustLife.zip impulse20/justlife:macos --userversion "$VERSION" --fix-permissions
          for channel in linux-x86_64 windows-x86_64 macos; do
            "$BUTLER" status "impulse20/justlife:$channel"
          done
          {
            echo '### JustLife uploaded to itch.io'
            echo "Version: \`$VERSION\`"
            echo
            echo '[Open JustLife](https://impulse20.itch.io/justlife)'
            echo
            echo '| Channel | Build |'
            echo '| --- | --- |'
            echo '| linux-x86_64 | Linux x86_64 |'
            echo '| windows-x86_64 | Windows x86_64 |'
            echo '| macos | macOS ZIP, Intel + Apple Silicon, ad-hoc signed |'
            echo
            echo 'itch.io may take a few minutes to finish processing the uploads.'
          } >> "$GITHUB_STEP_SUMMARY"
