[package]
name = "just-life"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.14.2", features = ["dynamic_linking", "wayland"] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"

[target.wasm32-unknown-unknown.dependencies]
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4.75"
web-sys = { version = "0.3.102", features = ["Window", "Storage"] }
getrandom = { version = "0.3.4", features = ["wasm_js"] }
uuid = { version = "1.23.3", features = ["js"] }

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true

# Fast verification build: no LTO, light opt, many codegen units. Much quicker
# and lower-memory than wasm-release (which OOMs/takes ~15 min under load).
# Use via `./build-wasm.sh wasm-dev`.
[profile.wasm-dev]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
