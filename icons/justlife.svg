<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Rounded background -->
  <rect width="1024" height="1024" rx="180" ry="180" fill="#9fd3e8"/>
  <!-- Sky gradient -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec8e3"/>
      <stop offset="55%" stop-color="#bfe3ff"/>
      <stop offset="55%" stop-color="#7cb342"/>
      <stop offset="100%" stop-color="#689f38"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4634f"/>
      <stop offset="100%" stop-color="#a83e2e"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e6c8"/>
      <stop offset="100%" stop-color="#e8d4a8"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3d6"/>
      <stop offset="60%" stop-color="#ffd27a"/>
      <stop offset="100%" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="180" ry="180" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="760" cy="200" r="180" fill="url(#sunGlow)" opacity="0.5"/>
  <circle cx="760" cy="200" r="100" fill="#ffd27a"/>
  <circle cx="760" cy="200" r="72" fill="#fff3d6"/>
  <!-- Sun smile -->
  <path d="M 720 200 Q 760 240 800 200" stroke="#e8a050" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="735" cy="180" r="10" fill="#e8a050"/>
  <circle cx="785" cy="180" r="10" fill="#e8a050"/>

  <!-- Grass ground -->
  <rect x="0" y="560" width="1024" height="464" rx="0" fill="#7cb342"/>
  <rect x="0" y="560" width="1024" height="20" fill="#8bc34a"/>

  <!-- House body (wall) -->
  <rect x="300" y="420" width="340" height="240" rx="8" fill="url(#wall)"/>

  <!-- Roof (triangle) -->
  <polygon points="260,430 470,270 680,430" fill="url(#roof)"/>
  <polygon points="260,430 470,275 680,430" fill="none" stroke="#8b3020" stroke-width="4"/>

  <!-- Chimney -->
  <rect x="560" y="300" width="40" height="80" fill="#8d6e63"/>
  <rect x="555" y="295" width="50" height="12" fill="#6d4c41"/>

  <!-- Door -->
  <rect x="430" y="520" width="80" height="140" rx="6" fill="#5d4037"/>
  <rect x="430" y="520" width="80" height="12" fill="#4e342e"/>
  <circle cx="498" cy="595" r="6" fill="#ffd27a"/>

  <!-- Windows (warm glow) -->
  <rect x="340" y="470" width="60" height="60" rx="4" fill="#ffe082"/>
  <rect x="340" y="470" width="60" height="60" rx="4" fill="none" stroke="#d4a040" stroke-width="4"/>
  <line x1="370" y1="470" x2="370" y2="530" stroke="#d4a040" stroke-width="3"/>
  <line x1="340" y1="500" x2="400" y2="500" stroke="#d4a040" stroke-width="3"/>

  <rect x="540" y="470" width="60" height="60" rx="4" fill="#ffe082"/>
  <rect x="540" y="470" width="60" height="60" rx="4" fill="none" stroke="#d4a040" stroke-width="4"/>
  <line x1="570" y1="470" x2="570" y2="530" stroke="#d4a040" stroke-width="3"/>
  <line x1="540" y1="500" x2="600" y2="500" stroke="#d4a040" stroke-width="3"/>

  <!-- Tree (left of house) -->
  <rect x="195" y="500" width="24" height="100" rx="4" fill="#6d4c41"/>
  <circle cx="207" cy="470" r="70" fill="#4caf50"/>
  <circle cx="175" cy="445" r="50" fill="#43a047"/>
  <circle cx="240" cy="445" r="50" fill="#43a047"/>
  <circle cx="207" cy="420" r="45" fill="#66bb6a"/>

  <!-- Small bush (right of house) -->
  <circle cx="710" cy="630" r="35" fill="#81c784"/>
  <circle cx="745" cy="640" r="28" fill="#66bb6a"/>

  <!-- Stone path -->
  <rect x="430" y="660" width="80" height="16" rx="3" fill="#b0a8a0"/>
  <rect x="430" y="690" width="80" height="16" rx="3" fill="#a89e96"/>
  <rect x="430" y="720" width="80" height="16" rx="3" fill="#b0a8a0"/>
</svg>